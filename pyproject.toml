[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "r2r"
version = "0.1.0"
description = "R2R (Raw to Real): ETL and EDA pipeline for PyPI supply-chain risk data"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "pydantic>=2.0",
  "requests>=2.31",
  "packaging>=23.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
