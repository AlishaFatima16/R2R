name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: r2r
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: r2r
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U r2r -d r2r"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://r2r:ci_password@localhost:5432/r2r

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Apply migrations
        run: python -m pipeline.load.migrate

      - name: Apply again (must change nothing)
        run: python -m pipeline.load.migrate

      - name: Migration status
        run: python -m pipeline.load.migrate --status

      - name: Tests
        run: pytest